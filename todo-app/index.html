<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>📋 My Todo List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <main class="app-main">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="btn btn-primary">Add</button>
                </div>
                <div class="counter">
                    <span id="totalCount" class="count-item">Total: <strong>0</strong></span>
                    <span id="activeCount" class="count-item">Active: <strong>0</strong></span>
                    <span id="completedCount" class="count-item">Done: <strong>0</strong></span>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Todos List -->
            <div class="todos-container">
                <ul id="todoList" class="todo-list">
                    <!-- Todos will be inserted here by JavaScript -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <p>📝 No todos yet!</p>
                    <p>Add one above to get started</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-section">
                <button id="clearBtn" class="btn btn-secondary">Clear Completed</button>
                <button id="exportBtn" class="btn btn-secondary">Export</button>
                <button id="importBtn" class="btn btn-secondary">Import</button>
                <input type="file" id="importFile" class="hidden" accept=".json">
            </div>
        </main>

        <footer class="app-footer">
            <p>💡 Tip: Double-click to edit, press Enter to save, press Esc to cancel</p>
            <p>Data is automatically saved to your browser's local storage</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
